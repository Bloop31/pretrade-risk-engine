name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Database 15 of the throwaway service container, as the least-privilege user
      # created below; the real-Redis tests refuse a non-empty db.
      REDIS_TEST_URL: redis://risk-test:ci-only-password@localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - name: Create a Redis user from deploy/redis-acl-rules
        # The tests run as this user, so CI fails if the service ever needs a command
        # the documented ACL does not grant. dbsize/flushdb are for test cleanup only.
        run: |
          set -f  # the rules contain ~risk:*, which must reach redis-cli unexpanded
          rules=$(grep -v '^#' deploy/redis-acl-rules)
          docker run --rm --network host redis:7 \
            redis-cli -h 127.0.0.1 ACL SETUSER risk-test on '>ci-only-password' $rules +dbsize +flushdb
          docker run --rm --network host redis:7 redis-cli -h 127.0.0.1 ACL GETUSER risk-test

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test (unit, fakeredis and real Redis)
        run: make test

  docker:
    name: Docker image, compose smoke test and load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_KEYS: ci-client-key-000000001
      ADMIN_API_KEY: ci-admin-key-000000001
      RISK_API_KEY: ci-client-key-000000001
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Start api + redis
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8000/health/ready
          # Without a key, /v1 must refuse.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8000/v1/prices)" = 401
          curl --fail --silent --show-error -X PUT http://localhost:8000/v1/prices/AAPL \
            -H "X-API-Key: $API_KEYS" -H 'content-type: application/json' -d '{"price": "100"}'
          curl --fail --silent --show-error -X POST http://localhost:8000/v1/orders/check \
            -H "X-API-Key: $API_KEYS" -H 'content-type: application/json' \
            -d '{"client_order_id":"smoke-1","account":"SMOKE","symbol":"AAPL","side":"BUY","order_type":"LIMIT","quantity":"10","price":"100"}' \
            | tee /dev/stderr | grep -q '"decision":"ACCEPT"'

      - name: Load test
        run: |
          uv sync --locked
          make loadtest ARGS="--requests 5000 --concurrency 32"

      - name: Service logs
        if: always()
        run: docker compose logs --no-color api | tail -n 100

      - name: Stop
        if: always()
        run: docker compose down --volumes
